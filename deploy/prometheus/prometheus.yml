# Prometheus scrapes GET /metrics of every .NET service on the Docker network.
# The `service` label is the compose service name; Grafana filters on it.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: exe-services
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
        labels: { service: gateway }
      - targets: ["auth-service:8080"]
        labels: { service: auth-service }
      - targets: ["team-service:8080"]
        labels: { service: team-service }
      - targets: ["matching-service:8081"]   # 8080 is HTTP/2-only gRPC; metrics live on the health port
        labels: { service: matching-service }
      - targets: ["noti-service:8080"]
        labels: { service: noti-service }
